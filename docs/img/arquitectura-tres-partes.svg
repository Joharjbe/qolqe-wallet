<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Arquitectura de la automatización de Qolqe: tres partes, pipeline y reportería</title>
<desc id="descripcion">Las tres partes (API con pytest-bdd y Schemathesis, web con playwright-bdd y Playwright, rendimiento con k6) prueban el mismo Qolqe sin modificarlo. La API y la web corren en el pipeline de GitHub Actions (estatico, contrato, api, web, quality-gate, reportes, gestion-casos, publicar); el rendimiento corre fuera, en Docker con 1 CPU. Todo termina en el resumen del run, en GitHub Pages y en Kiwi TCMS.</desc>

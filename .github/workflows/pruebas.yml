# Pipeline del módulo G4: API + contrato -> web -> reportes publicados.
name: Pruebas G4

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: api
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QOLQE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Levantar Qolqe en modo de pruebas
        run: |
          QOLQE_BD=datos/ci.db QOLQE_MODO_PRUEBA=1 nohup python -m uvicorn qolqe.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          curl --silent --fail --retry 60 --retry-delay 1 --retry-connrefused "$QOLQE_URL/api/salud"
      - name: Pruebas de API (pytest-bdd)
        run: |
          mkdir -p reportes/api
          python -m pytest tests/api --junitxml=reportes/api/junit.xml --html=reportes/api/reporte.html --self-contained-html
      - name: Pruebas de contrato (Schemathesis)
        run: |
          curl --silent --fail -X POST "$QOLQE_URL/api/pruebas/reiniciar"
          TOKEN=$(curl --silent --fail -X POST "$QOLQE_URL/api/auth/login" -H "Content-Type: application/json" \
            -d '{"celular":"987654321","pin":"4826"}' | python -c "import json,sys;print(json.load(sys.stdin)['access_token'])")
          # Excluidos por decisión documentada en docs/defectos.md (DEF-05, DEF-06 y un falso positivo).
          schemathesis run "$QOLQE_URL/openapi.json" -H "Authorization: Bearer $TOKEN" \
            --include-path-regex '^/api/(contactos|solicitudes)' \
            --exclude-checks positive_data_acceptance,allow_header_conformance,ensure_resource_availability \
            --max-examples 30 --seed 42 \
            --report junit,html --report-junit-path reportes/contrato/junit.xml --report-html-path reportes/contrato/html
      - name: Resumen del job
        if: ${{ !cancelled() }}
        run: python .github/scripts/resumen.py "API" reportes/api/junit.xml "Contrato" reportes/contrato/junit.xml
      - name: Publicar artefacto
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reportes-api
          path: |
            reportes/
            uvicorn.log

  web:
    name: web
    needs: api
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt -c constraints.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Pruebas web (Playwright), 3 veces seguidas
        run: |
          npx bddgen
          npx playwright test --repeat-each=3
      - name: Resumen del job
        if: ${{ !cancelled() }}
        run: python .github/scripts/resumen.py "Web x3" reportes/web/junit.xml
      - name: Publicar artefacto
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reportes-web
          path: reportes/

  reportes:
    name: reportes
    needs: [api, web]
    # Solo en main. También publica si algo falló: el reporte es lo que explica el fallo.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.api.result != 'skipped' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: reportes-*
          path: descargas
          merge-multiple: true
      - name: Armar la matriz de trazabilidad y la portada
        run: python .github/scripts/trazabilidad.py --reportes descargas/reportes --sitio sitio --matriz sitio/trazabilidad.md
      - name: Mostrar la matriz en el resumen del run
        run: cat sitio/trazabilidad.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: despliegue
        uses: actions/deploy-pages@v4

[pytest]
pythonpath = .
testpaths = tests
bdd_features_base_dir = features/
junit_family = xunit1
markers =
    HU-G4-01: Agregar un contacto
    HU-G4-02: Ver y buscar mis contactos
    HU-G4-03: Editar un contacto
    HU-G4-04: Eliminar un contacto
    HU-G4-05: Transferir a un contacto
    HU-G4-06: Solicitar dinero a un contacto
    HU-G4-07: Ver mis solicitudes
    HU-G4-08: Aceptar una solicitud recibida
    HU-G4-09: Rechazar una solicitud recibida
    HU-G4-10: Cancelar una solicitud enviada
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning
